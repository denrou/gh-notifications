# Builds the package and publishes a GitHub Release when a v* tag is pushed.
# There is no PyPI or Homebrew step: install from the tag with uv (see README).

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - name: Check that the tag matches the project version
        run: |
          version="$(uv version --short)"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "pyproject.toml version is $version but the tag is v$tag" >&2
            exit 1
          fi

      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .

      - name: Build distributions
        run: uv build

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
